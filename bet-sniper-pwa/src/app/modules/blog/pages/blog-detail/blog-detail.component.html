<div class="blog-detail-page">
  <header class="blog-header">
    <div class="header-container">
      <a routerLink="/landing" class="logo-link">
        <img src="assets/logo_principal.png" alt="Bet Sniper" class="header-logo" />
      </a>
      <nav class="header-nav">
        <a routerLink="/landing" class="nav-link">Inicio</a>
        <a routerLink="/blog" class="nav-link">Blog</a>
        <a routerLink="/auth/login" class="nav-link">Iniciar Sesión</a>
      </nav>
    </div>
  </header>

  <div class="detail-content">
    <div class="detail-loading" *ngIf="loading">
      <i class="fa fa-spinner fa-spin"></i> Cargando artículo...
    </div>

    <div class="detail-error" *ngIf="error">
      <i class="fa fa-exclamation-triangle"></i>
      <p>Artículo no encontrado</p>
      <a routerLink="/blog" class="btn-back">Volver al Blog</a>
    </div>

    <article class="article" *ngIf="post && !loading">
      <a routerLink="/blog" class="back-link"><i class="fa fa-arrow-left"></i> Volver al Blog</a>

      <div class="article-cover" *ngIf="post.coverImage">
        <img [src]="post.coverImage" [alt]="post.title" />
      </div>

      <div class="article-tags" *ngIf="post.tags && post.tags.length">
        <span class="tag" *ngFor="let tag of post.tags">{{ tag }}</span>
      </div>

      <h1 class="article-title">{{ post.title }}</h1>

      <div class="article-meta">
        <span *ngIf="post.author"><i class="fa fa-user"></i> {{ post.author }}</span>
        <span><i class="fa fa-calendar"></i> {{ formatDate(post.publishedAt) }}</span>
        <span><i class="fa fa-eye"></i> {{ post.views }} vistas</span>
      </div>

      <div class="article-body" [innerHTML]="post.content"></div>

      <div class="article-footer">
        <a routerLink="/blog" class="btn-back">
          <i class="fa fa-arrow-left"></i> Más Artículos
        </a>
        <a routerLink="/auth/register" class="btn-cta">
          <i class="fa fa-rocket"></i> Únete a Bet Sniper
        </a>
      </div>
    </article>
  </div>
</div>
