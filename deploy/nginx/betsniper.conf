# ─── Bet Sniper - Nginx Reverse Proxy ─────────────────────
# Subdomains:
#   betsniper.com          → PWA (Angular)
#   panel.betsniper.com    → Admin Panel (Angular)
#   services.betsniper.com → Backend API (NestJS)

# ─── HTTP → HTTPS redirect ────────────────────────────────────
server {
    listen 80;
    server_name betsniper.com www.betsniper.com panel.betsniper.com services.betsniper.com;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── PWA: betsniper.com (HTTPS) ────────────────────────────
server {
    listen 443 ssl;
    server_name betsniper.com www.betsniper.com;

    ssl_certificate /etc/letsencrypt/live/betsniper.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/betsniper.com/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        proxy_pass http://pwa:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── Admin Panel: panel.betsniper.com (HTTPS) ──────────────
server {
    listen 443 ssl;
    server_name panel.betsniper.com;

    ssl_certificate /etc/letsencrypt/live/betsniper.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/betsniper.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        proxy_pass http://panel-admin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── Backend API: services.betsniper.com (HTTPS) ───────────
server {
    listen 443 ssl;
    server_name services.betsniper.com;

    ssl_certificate /etc/letsencrypt/live/betsniper.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/betsniper.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Increase timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Allow large request bodies (file uploads)
        client_max_body_size 50M;
    }
}
